<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Draken — AI Chat Assistant</title>
    <script>
      // GitHub Pages SPA redirect hack:
      // When GH Pages returns 404 for a deep-link, this script encodes
      // the path into a query string and redirects to the root index.html,
      // where the main app script decodes it back to the real path.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
